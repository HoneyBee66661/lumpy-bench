name: CI

on:
  push:
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Uji unit
        run: pytest -q
      - name: Alur penuh pada data contoh + bukti regenerasi
        run: |
          python -m lumpy_bench synth-data
          python -m lumpy_bench regenerate
          python -m lumpy_bench verify
