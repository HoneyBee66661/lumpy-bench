[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumpy-bench"
version = "0.2.0"
description = "Kerangka pengujian peramalan permintaan lumpy pada kebijakan persediaan (Random Forest vs Croston-SBA, tingkat layanan disamakan)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joni Subakti" }]
keywords = ["intermittent demand", "lumpy demand", "Croston-SBA", "Random Forest", "inventory policy", "reproducibility"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
statsforecast = ["statsforecast>=1.7"]
dev = ["pytest>=7.4"]

[project.scripts]
lumpy-bench = "lumpy_bench.__main__:main"

[tool.setuptools]
packages = ["lumpy_bench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
